# Quand une « Release » est publiée sur GitHub (ex. v1.12.0), compile l'outil et y joint l'archive.
# When a Release is published on GitHub (e.g. v1.12.0), builds the tool and attaches the archive.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Assembler la page / build the page
        run: python3 build.py
      - name: Compiler le lanceur / build the launcher
        working-directory: launcher
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-H windowsgui -s -w" -o ../dist/CourbeurDeFrise.exe .
      - name: Archive
        run: |
          mkdir -p "pkg/Courbeur de frise"
          cp dist/CourbeurDeFrise.exe dist/courbeur.html LICENSE THIRD_PARTY_NOTICES.md README.md "pkg/Courbeur de frise/"
          cp -r examples "pkg/Courbeur de frise/"
          (cd pkg && zip -r "../Courbeur-de-frise-${GITHUB_REF_NAME}.zip" "Courbeur de frise")
          (cd dist && sha256sum CourbeurDeFrise.exe courbeur.html > ../SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: courbeur-de-frise
          path: |
            Courbeur-de-frise-*.zip
            SHA256SUMS.txt
      - name: Publier / release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Courbeur-de-frise-*.zip
            SHA256SUMS.txt
            dist/courbeur.html
